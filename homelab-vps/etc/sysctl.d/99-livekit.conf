# UDP socket buffers for the LiveKit SFU.
#
# The kernel default (212992) is far too small for an SFU: it receives every
# participant stream and fans each one out to every other participant on the
# same socket. Once the buffer fills the kernel silently drops datagrams, which
# surfaces as choppy audio and frozen video under load — not as a failed
# connection, so it reads like a network problem rather than a host setting.
# LiveKit warns about this at startup and asks for 5000000.
#
# Only the maxima are raised. rmem_default/wmem_default stay untouched so this
# does not inflate the buffers of every unrelated socket on the host.

net.core.rmem_max = 5000000
net.core.wmem_max = 5000000
