---

# Docker Compose stack for monitoring services: node-exporter and cadvisor

name: monitoring

services:
  node-exporter:
    image: prom/node-exporter:v1.12.1
    container_name: node-exporter
    restart: unless-stopped
    command:
      - '--path.procfs=/host/proc'
      - '--path.rootfs=/rootfs'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
      - '--collector.processes'
      # Host netns exposes every docker veth and bridge to the netdev
      # collector; keep only the real uplink and the mesh interface.
      - '--collector.netdev.device-exclude=^(veth.*|br-.*|docker0|lo)$$'
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    # /proc/net is namespace-scoped, so bind-mounting host /proc still yields
    # the container's own traffic counters. Host netns is the only way to get
    # real byte/packet metrics for eth0. Safe without the published port:
    # nftables input policy is drop and 9100 is accepted only on wt0.
    network_mode: host
    pid: host
    uts: "host"
    user: "65534:65534"
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.55.1
    container_name: cadvisor
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:rw
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
