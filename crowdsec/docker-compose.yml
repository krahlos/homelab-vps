---

# docker-compose.yml for crowdsec

name: crowdsec

services:
  crowdsec:
    image: crowdsecurity/crowdsec:v1.7.8
    container_name: crowdsec
    # unless-stopped, not on-failure:N — a retry budget is spent permanently.
    # A transient failure at boot (DNS, a late mesh address) exhausts it and
    # leaves crowdsec down for good, taking the host firewall bouncer with it.
    restart: unless-stopped
    networks:
      netbird:
        ipv4_address: 172.30.0.5
    environment:
      PGID: "1000"
      COLLECTIONS: >-
        crowdsecurity/dovecot
        crowdsecurity/haproxy
        crowdsecurity/http-cve
        crowdsecurity/iptables
        crowdsecurity/linux
        crowdsecurity/sshd
        crowdsecurity/postfix
        crowdsecurity/traefik
        crowdsecurity/whitelist-good-actors
    volumes:
      - crowdsec_data:/var/lib/crowdsec/data
      - crowdsec_config:/etc/crowdsec
      - ./logs:/var/log/crowdsec
      - traefik_logs:/var/log/traefik:ro
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
      - /var/log/syslog:/var/log/syslog:ro
      - /var/log/auth-crowdsec.log:/var/log/auth-crowdsec.log:ro
    expose:
      - "6060"  # Metrics port
    # Bound to all interfaces rather than 100.69.0.1: that address does not
    # exist until netbird.service has connected, so binding it makes container
    # start depend on boot order (see fc208cd, which hit this on netbird-server).
    # Neither port is open in the Hetzner cloud firewall, so in practice they
    # are reachable only over wt0 and loopback.
    ports:
      - "6060:6060"  # Metrics — scraped by the homeserver Prometheus over the mesh
      - "8180:8080"  # LAPI — host bouncer via loopback, homeserver Grafana over the mesh
    labels:
      - "traefik.enable=false"

networks:
  netbird:
    external: true

volumes:
  crowdsec_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /data/docker/volumes/crowdsec/crowdsec_data
  crowdsec_config:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /data/docker/volumes/crowdsec/crowdsec_config
  traefik_logs:
    name: traefik_traefik_logs
    external: true
